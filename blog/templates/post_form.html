{% extends 'base.html' %}
{% load my_tags %}
{% block title %} Форма публикации {% endblock %}
{% block content %}
<div class="container mb-3">
  <h1 class="mb-4">Форма</h1>
  <form method="post" enctype='multipart/form-data'>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
