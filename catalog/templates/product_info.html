{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h2>{{product.name}}</h2>
                </div>
                <div class="card-body text-center">
                    <img src="{{product.image | media_filter}}" class="img-fluid mb-4" style="max-height: 400px;" alt="{{product.name}}">
                    <h3 class="card-title text-success mb-3">{{product.price}} ₽</h3>
                    <p class="card-text mb-4">{{product.description}}</p>
                    <div class="d-flex justify-content-around mb-4">
                        <div>
                            <p class="text-muted mb-1"><small>Дата создания</small></p>
                            <p>{{product.created_at|date:"d.m.Y"}}</p>
                        </div>
                        <div>
                            <p class="text-muted mb-1"><small>Дата изменения</small></p>
                            <p>{{product.updated_at|date:"d.m.Y"}}</p>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-lg px-5">Добавить в корзину</button>
                    <div>
                        <a href="{% url 'catalog:home' %}" class="btn btn-primary">Назад</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
