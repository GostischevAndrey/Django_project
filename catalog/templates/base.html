<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link href="/static/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <style>
        .sidebar {
            background-color: black;
            color: white;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .sidebar-link {
            color: white;
            text-decoration: none;
            padding: 8px 0;
            display: block;
        }
        .sidebar-link:hover {
            color: #ddd;
        }
        .sidebar-menu {
            list-style: none;
            padding-left: 0;
        }
        .sidebar-divider {
            border-color: #444;
            margin: 15px 0;
        }
        .header-top {
            padding: 15px 0;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        main {
            padding: 20px;
        }
    </style>
</head>
<body>
    {% include 'header.html' %}
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 sidebar">
                <nav class="sidebar-nav">
                    <h2 class="visually-hidden">Основное меню</h2>
                    <h6 class="sidebar-title">Меню</h6>
                    <hr class="sidebar-divider">
                    <ul class="sidebar-menu">
                        <li><a class="sidebar-link" href="/">Главная</a></li>
                        <li><a class="sidebar-link" href="categories/">Категории</a></li>
                        <li><a class="sidebar-link" href="catalog/">Заказы</a></li>
                        <li><a class="sidebar-link" href="contacts/">Контакты</a></li>
                    </ul>
                </nav>
            </aside>
            <main class="col-md-10">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
